# ===========================================
# Envoy Gateway - Local Development Config
# ===========================================
# TLS disabled for local docker-compose environment
# Uses container names for service discovery

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp: "%START_TIME%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(:PATH)%"
                          protocol: "%PROTOCOL%"
                          response_code: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          request_id: "%REQ(X-REQUEST-ID)%"
                          jwt_sub: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:payload:sub)%"
                          jwt_jti: "%DYNAMIC_METADATA(envoy.filters.http.jwt_authn:payload:jti)%"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/health"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"healthy"}'
                          response_headers_to_add:
                            - header:
                                key: "content-type"
                                value: "application/json"
                        - match:
                            prefix: "/tool/resident-info"
                          route:
                            cluster: service_c
                            prefix_rewrite: "/resident-info"
                          request_headers_to_add:
                            - header:
                                key: "X-Tool-Api-Key"
                                value: "${TOOL_API_KEY}"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - match:
                            prefix: "/tool/execute"
                          route:
                            cluster: service_c
                            prefix_rewrite: "/execute"
                          request_headers_to_add:
                            - header:
                                key: "X-Tool-Api-Key"
                                value: "${TOOL_API_KEY}"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - match:
                            prefix: "/tool"
                          route:
                            cluster: service_c
                            prefix_rewrite: "/"
                          request_headers_to_add:
                            - header:
                                key: "X-Tool-Api-Key"
                                value: "${TOOL_API_KEY}"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        judgment_provider:
                          issuer: "judgment"
                          audiences:
                            - "envoy-gateway"
                          remote_jwks:
                            http_uri:
                              uri: "http://service-a:8080/.well-known/jwks.json"
                              cluster: service_a_jwks
                              timeout: 5s
                            cache_duration: 300s
                          forward: true
                          clock_skew_seconds: 1
                          payload_in_metadata: "payload"
                      rules:
                        - match:
                            prefix: "/health"
                        - match:
                            prefix: "/tool/resident-info"
                          requires:
                            provider_name: "judgment_provider"
                        - match:
                            prefix: "/tool/execute"
                          requires:
                            provider_name: "judgment_provider"
                        - match:
                            prefix: "/tool"
                          requires:
                            provider_name: "judgment_provider"

                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: ALLOW
                        policies:
                          "resident-info-policy":
                            permissions:
                              - header:
                                  {
                                    name: ":path",
                                    string_match:
                                      { prefix: "/tool/resident-info" },
                                  }
                            principals:
                              - metadata:
                                  filter: "envoy.filters.http.jwt_authn"
                                  path:
                                    - key: "payload"
                                    - key: "scope"
                                  value:
                                    string_match:
                                      exact: "execute:get_resident_info"
                          "other-tools":
                            permissions:
                              - header:
                                  {
                                    name: ":path",
                                    string_match: { prefix: "/tool/execute" },
                                  }
                            principals:
                              - any: true
                          "public":
                            permissions:
                              - header:
                                  {
                                    name: ":path",
                                    string_match: { prefix: "/health" },
                                  }
                            principals:
                              - any: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # service-c: Tool Executor (HTTP, no TLS)
    - name: service_c
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: service_c
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: service-c
                      port_value: 8080

    # service-a: JWKS endpoint (HTTP, no TLS)
    - name: service_a_jwks
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: service_a_jwks
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: service-a
                      port_value: 8080
